<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager | Malik Sharia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f3f0ff;color:#14122b;min-height:100vh;padding:2rem 1rem}
.app{max-width:560px;margin:0 auto}
.back{display:inline-block;margin-bottom:1.2rem;color:#4528d6;font-weight:600;text-decoration:none}
h1{font-size:2rem;margin-bottom:.3rem}
.hint{color:#556078;margin-bottom:1.5rem}
form{display:flex;gap:.6rem;margin-bottom:1rem}
input{flex:1;padding:.8rem 1rem;border:1.5px solid #d9d2fb;border-radius:10px;font:inherit}
input:focus{outline:none;border-color:#5b3df5;box-shadow:0 0 0 3px rgba(91,61,245,.18)}
button{font:inherit;cursor:pointer}
.add{background:#ffb020;border:0;border-radius:10px;padding:.8rem 1.3rem;font-weight:700;color:#14122b}
.filters{display:flex;gap:.5rem;margin-bottom:1rem}
.filters button{background:#fff;border:1.5px solid #d9d2fb;border-radius:99px;padding:.35rem 1rem;font-weight:600;color:#4528d6}
.filters button.on{background:#5b3df5;border-color:#5b3df5;color:#fff}
ul{list-style:none;display:grid;gap:.6rem}
li{display:flex;align-items:center;gap:.8rem;background:#fff;border:1px solid #e2dcfb;border-radius:12px;padding:.8rem 1rem}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:#8a85a8}
li input[type=checkbox]{flex:none;width:20px;height:20px;accent-color:#5b3df5}
.del{background:none;border:0;color:#b91c1c;font-weight:600}
.count{margin-top:1rem;color:#556078;font-size:.92rem}
</style>
</head>
<body>
<main class="app">
<a class="back" href="../index.html#projects">&larr; Back to portfolio</a>
<h1>Task Manager</h1>
<p class="hint">Add tasks, tick them off and filter the list. Your tasks stay saved in this browser.</p>
<form id="taskForm"><input id="taskInput" type="text" placeholder="What needs doing?" aria-label="New task" maxlength="80"><button class="add" type="submit">Add</button></form>
<div class="filters" id="filters"><button class="on" data-f="all">All</button><button data-f="active">Active</button><button data-f="done">Done</button></div>
<ul id="list"></ul>
<p class="count" id="count"></p>
</main>
<script>
const form = document.getElementById('taskForm');
const input = document.getElementById('taskInput');
const list = document.getElementById('list');
const count = document.getElementById('count');
const filterBox = document.getElementById('filters');
let filter = 'all';
let tasks = [];

try { tasks = JSON.parse(localStorage.getItem('mk-tasks')) || []; } catch (e) { tasks = []; }

function save() {
  try { localStorage.setItem('mk-tasks', JSON.stringify(tasks)); } catch (e) {}
}

function render() {
  const shown = tasks.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done));
  list.innerHTML = '';
  shown.forEach(t => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = t.done;
    box.setAttribute('aria-label', 'Mark task done');
    box.addEventListener('change', () => { t.done = box.checked; save(); render(); });
    const text = document.createElement('span');
    text.textContent = t.text;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'Delete';
    del.addEventListener('click', () => { tasks = tasks.filter(x => x.id !== t.id); save(); render(); });
    li.append(box, text, del);
    list.appendChild(li);
  });
  const left = tasks.filter(t => !t.done).length;
  count.textContent = tasks.length ? left + ' of ' + tasks.length + ' tasks left' : 'No tasks yet. Add your first one above.';
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const value = input.value.trim();
  if (!value) return;
  tasks.unshift({ id: Date.now(), text: value, done: false });
  input.value = '';
  save();
  render();
});

filterBox.addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  filter = e.target.dataset.f;
  filterBox.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target));
  render();
});

render();
</script>
</body>
</html>
