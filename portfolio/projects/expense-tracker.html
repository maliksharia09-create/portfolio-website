<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker | Malik Sharia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f3f0ff;color:#14122b;min-height:100vh;padding:2rem 1rem}
.app{max-width:640px;margin:0 auto}
.back{display:inline-block;margin-bottom:1.2rem;color:#4528d6;font-weight:600;text-decoration:none}
h1{font-size:2rem;margin-bottom:.3rem}
.hint{color:#556078;margin-bottom:1.5rem}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.4rem}
.totals div{background:#fff;border:1px solid #e2dcfb;border-top:4px solid #5b3df5;border-radius:12px;padding:.9rem}
.totals div:nth-child(2){border-top-color:#ffb020}.totals div:nth-child(3){border-top-color:#14122b}
.totals small{display:block;color:#556078;font-size:.8rem}
.totals strong{font-size:1.2rem}
form{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:.6rem;margin-bottom:.4rem}
input,select{padding:.75rem .9rem;border:1.5px solid #d9d2fb;border-radius:10px;font:inherit;background:#fff;min-width:0}
input:focus,select:focus{outline:none;border-color:#5b3df5;box-shadow:0 0 0 3px rgba(91,61,245,.18)}
.add{background:#ffb020;border:0;border-radius:10px;padding:.75rem 1.2rem;font:700 1rem inherit;cursor:pointer;color:#14122b}
.msg{color:#b91c1c;font-size:.88rem;min-height:1.3rem;margin-bottom:.8rem}
ul{list-style:none;display:grid;gap:.6rem}
li{display:flex;align-items:center;gap:.8rem;background:#fff;border:1px solid #e2dcfb;border-radius:12px;padding:.8rem 1rem}
li .info{flex:1;min-width:0}li .info small{display:block;color:#556078}
li .amt{font-weight:700}li.income .amt{color:#047857}
.del{background:none;border:0;color:#b91c1c;font:600 .9rem inherit;cursor:pointer}
@media(max-width:560px){form{grid-template-columns:1fr 1fr}.add{grid-column:1/-1}.totals{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<a class="back" href="../index.html#projects">&larr; Back to portfolio</a>
<h1>Expense Tracker</h1>
<p class="hint">Record income and expenses and see your balance update instantly. Data stays in this browser.</p>
<div class="totals">
<div><small>Balance</small><strong id="balance">0.00</strong></div>
<div><small>Income</small><strong id="income">0.00</strong></div>
<div><small>Expenses</small><strong id="expense">0.00</strong></div>
</div>
<form id="form" novalidate>
<input id="title" type="text" placeholder="Description" aria-label="Description" maxlength="40">
<input id="amount" type="number" min="0" step="0.01" placeholder="Amount" aria-label="Amount">
<select id="type" aria-label="Type"><option value="expense">Expense</option><option value="income">Income</option></select>
<button class="add" type="submit">Add</button>
</form>
<p class="msg" id="msg" role="alert"></p>
<ul id="list"></ul>
</main>
<script>
const form = document.getElementById('form');
const titleEl = document.getElementById('title');
const amountEl = document.getElementById('amount');
const typeEl = document.getElementById('type');
const msg = document.getElementById('msg');
const list = document.getElementById('list');
let items = [];

try { items = JSON.parse(localStorage.getItem('mk-expenses')) || []; } catch (e) { items = []; }

const money = n => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function save() {
  try { localStorage.setItem('mk-expenses', JSON.stringify(items)); } catch (e) {}
}

function render() {
  list.innerHTML = '';
  let income = 0, expense = 0;
  items.forEach(item => {
    if (item.type === 'income') income += item.amount; else expense += item.amount;
    const li = document.createElement('li');
    li.className = item.type;
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('strong');
    name.textContent = item.title;
    const kind = document.createElement('small');
    kind.textContent = item.type === 'income' ? 'Income' : 'Expense';
    info.append(name, kind);
    const amt = document.createElement('span');
    amt.className = 'amt';
    amt.textContent = (item.type === 'income' ? '+' : '-') + money(item.amount);
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'Delete';
    del.addEventListener('click', () => { items = items.filter(x => x.id !== item.id); save(); render(); });
    li.append(info, amt, del);
    list.appendChild(li);
  });
  document.getElementById('income').textContent = money(income);
  document.getElementById('expense').textContent = money(expense);
  document.getElementById('balance').textContent = money(income - expense);
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const title = titleEl.value.trim();
  const amount = parseFloat(amountEl.value);
  if (!title) { msg.textContent = 'Please enter a description.'; titleEl.focus(); return; }
  if (!amount || amount <= 0) { msg.textContent = 'Enter an amount greater than zero.'; amountEl.focus(); return; }
  msg.textContent = '';
  items.unshift({ id: Date.now(), title, amount, type: typeEl.value });
  titleEl.value = '';
  amountEl.value = '';
  save();
  render();
});

render();
</script>
</body>
</html>
